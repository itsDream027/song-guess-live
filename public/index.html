<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทายเพลง Live</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a1e;--card:#1a1438;--pink:#ff2e88;--cyan:#27e3ff;--yel:#ffd23f;--ok:#3dffb0;--ink:#fff6e6;--mute:#a79bd0}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Sarabun,sans-serif;min-height:100dvh;
 background:radial-gradient(60% 40% at 15% 0,#5b1b8f66,transparent),radial-gradient(50% 40% at 90% 100%,#ff2e8833,transparent),var(--bg)}
h1,h2,.slot,.pill,#winner,button{font-family:Mitr,sans-serif}
button{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:600;color:#fff;background:var(--pink);cursor:pointer}
button.ghost{background:#ffffff14}
/* setup */
#setup{max-width:480px;margin:0 auto;padding:36px 22px;display:flex;flex-direction:column;gap:10px;text-align:center}
#setup h1{font-size:34px;margin:6px 0 0}
#setup input,#setup select{width:100%;padding:14px;border-radius:12px;border:2px solid #ffffff22;background:#ffffff0d;color:var(--ink);font:inherit;font-size:16px}
#setup select option{color:#000}
small{color:var(--mute)}
.logo{width:120px;height:120px;margin:0 auto;border-radius:50%;background:repeating-radial-gradient(#0a0a0a 0 3px,#1c1c1c 4px 5px);position:relative;animation:spin 6s linear infinite;box-shadow:0 0 40px #ff2e8855}
.logo::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--pink)}
/* game */
#game{display:none;flex-direction:column;align-items:center;gap:14px;max-width:560px;margin:0 auto;padding:14px 16px 24px;min-height:100dvh}
.top{display:flex;justify-content:space-between;width:100%;align-items:center}
.pill{background:var(--card);border:1px solid #ffffff22;border-radius:99px;padding:6px 16px;font-size:16px}
#timer{color:var(--yel);min-width:84px;text-align:center}
.deck{position:relative;width:min(300px,70vw);aspect-ratio:1;margin:14px 0 6px}
.ring{position:absolute;inset:-6%;width:112%;height:112%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.2}.trk{stroke:#ffffff18}
.prg{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:301.6;stroke-dashoffset:0;filter:drop-shadow(0 0 3px var(--cyan))}
.vinyl{width:100%;height:100%;border-radius:50%;position:relative;
 background:repeating-radial-gradient(circle,#070707 0 3px,#1a1a1a 4px 5px);box-shadow:0 18px 40px #000b,inset 0 0 0 5px #000;
 animation:spin 2.6s linear infinite;animation-play-state:paused}
.vinyl.on{animation-play-state:running}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 18%,#ffffff26 24%,transparent 30% 68%,#ffffff26 74%,transparent 80%)}
.label{position:absolute;inset:31%;border-radius:50%;background:#444 center/cover;border:3px solid #000;filter:blur(12px) grayscale(.5);transition:filter .8s}
.label.reveal{filter:none}
.label::after{content:"";position:absolute;inset:45%;border-radius:50%;background:var(--bg);border:2px solid #000}
.arm{position:absolute;right:-4%;top:-6%;width:12px;height:52%;transform-origin:50% 8px;transform:rotate(-12deg);transition:transform .8s;z-index:2}
.arm.on{transform:rotate(20deg)}
.arm::before{content:"";position:absolute;inset:0 3px;background:linear-gradient(90deg,#ddd,#888);border-radius:6px;box-shadow:0 4px 8px #0009}
.arm::after{content:"";position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:#444;border:3px solid #999}
@keyframes spin{to{transform:rotate(360deg)}}
#slots{display:flex;flex-wrap:wrap;gap:8px 6px;justify-content:center}
.slot{min-width:30px;height:44px;padding:0 4px;border-radius:10px;background:var(--card);border:2px solid #ffffff2a;font-size:24px;line-height:40px;text-align:center}
.slot.gap{background:none;border:0;min-width:12px}
.slot.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px #27e3ff55}
.slot.pop{animation:pop .4s cubic-bezier(.2,1.8,.4,1)}
#lyric{min-height:76px;width:100%;display:flex;justify-content:center}
#lyric span{background:#fff6e6;color:#1a1438;font-weight:700;font-size:19px;line-height:1.35;padding:12px 18px;border-radius:20px 20px 20px 4px;max-width:92%;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) translateY(16px);opacity:0}}
#winner{min-height:46px;font-size:24px;text-align:center;color:var(--ok)}
#winner.win{animation:pop .5s cubic-bezier(.2,1.6,.4,1);text-shadow:0 0 18px #3dffb088}
#winner.lose{color:var(--yel)}
.panel{width:100%;background:var(--card);border-radius:18px;padding:12px 14px;border:1px solid #ffffff14}
.panel h2{margin:0 0 6px;font-size:16px;color:var(--mute);font-weight:400}
#board{list-style:none;margin:0;padding:0}
#board li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff12}
#board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board b{color:var(--yel);font-family:Mitr}
#feed{max-height:92px;overflow:auto;font-size:14px;color:var(--mute)}#feed b{color:var(--ink)}
#test{display:flex;gap:6px;width:100%}#test input{flex:1;min-width:0;padding:10px;border-radius:10px;border:0;background:#ffffff14;color:var(--ink)}
#test button{padding:8px 14px}
#tap{position:fixed;inset:0;background:#0d0a1eee;display:none;align-items:center;justify-content:center;z-index:9}
#tap button{font-size:24px;padding:22px 34px;border-radius:20px;box-shadow:0 0 40px #ff2e8888}
#yt{position:fixed;right:0;bottom:0;width:200px;height:113px;opacity:.02;pointer-events:none;z-index:-1}
@media(prefers-reduced-motion:reduce){.vinyl,.logo{animation:none}}
.av{position:relative;width:var(--s);height:var(--s);border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--cyan));display:inline-grid;place-items:center;flex:none;overflow:hidden;font:600 calc(var(--s)*.45) Mitr;border:2px solid var(--yel);color:#fff}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#222}
.wcard{display:inline-flex;align-items:center;gap:14px;padding:12px 22px 12px 14px;border-radius:99px;background:linear-gradient(90deg,#ff2e88,#ffb12e);box-shadow:0 0 36px #ff2e8888;color:#fff;text-align:left}
.wn{font-size:22px;line-height:1.1;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wp{font:600 14px Sarabun}
#winner.win{text-shadow:none}
#board li{align-items:center}#board em{font-style:normal;width:26px;text-align:center;font-size:20px}
#board li.r0{background:linear-gradient(90deg,#ffd23f22,transparent);border-radius:12px}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:var(--cyan);color:#0d0a1e;font:600 16px Mitr;padding:10px 20px;border-radius:99px;z-index:20;transition:transform .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 8px 30px #27e3ff66}
#toast.show{transform:translate(-50%,0)}
.panel{background:linear-gradient(160deg,#241a4d,var(--card))}
#game{position:relative;z-index:1}
#lyricBg{width:100%;min-height:104px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 .3em;padding:4px 8px;font:600 clamp(24px,7.5vw,38px)/1.2 Mitr;text-align:center}
.w{opacity:0;transform:scale(.5);transition:opacity .35s,transform .45s cubic-bezier(.2,1.7,.4,1);color:#fff}
.w.on{opacity:.6;transform:none}
.w.cur{opacity:.9;color:var(--yel);text-shadow:0 0 28px #ffd23f99}
.stage{width:100%;display:flex;justify-content:center;padding:6px 0 4px}
.disc{position:absolute;inset:0;transition:transform .9s cubic-bezier(.2,.9,.3,1)}
.deck.reveal .disc{transform:translateX(26%) scale(.66)}
.ring{transition:opacity .5s}.deck.reveal .ring{opacity:0}
.sleeve{position:absolute;left:-4%;top:10%;width:80%;aspect-ratio:1;border-radius:6px;background:#333 center/cover;z-index:3;opacity:0;transform:translateX(-30%) scale(.7);transition:opacity .6s,transform .9s cubic-bezier(.2,.9,.3,1);box-shadow:0 18px 40px #000c,inset 0 0 0 1px #ffffff40}
.sleeve::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(115deg,#ffffff40,transparent 38%,transparent 70%,#00000055)}
.deck.reveal .sleeve{opacity:1;transform:none}
.rank{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;margin-top:6px}
.rk{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;padding:16px 2px 7px;background:var(--card);border:1px solid #ffffff14;border-radius:14px}
.rk i{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font:600 12px Mitr;font-style:normal;background:var(--pink);border-radius:99px;padding:0 9px}
.rk .nm{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk b{color:var(--yel);font:600 14px Mitr}
.rk.r0{background:linear-gradient(160deg,#ffd23f33,var(--card));border-color:var(--yel)}
.rk.r0 i{background:var(--yel);color:#1a1438}
.rk.empty{opacity:.45}
.ph{width:36px;height:36px;border-radius:50%;border:2px dashed #ffffff55}
#test{justify-content:center}
</style>
</head>
<body>
<div id="setup">
  <div class="logo"></div>
  <h1>🎵 ทายเพลง Live</h1>
  <small>ลิงก์เพลย์ลิสต์ YouTube</small>
  <input id="pl" placeholder="https://www.youtube.com/playlist?list=PL...">
  <small>ชื่อ TikTok ที่กำลังไลฟ์</small>
  <input id="ws" placeholder="@username" autocapitalize="off">
  <small>เวลาต่อรอบ</small>
  <select id="dur"><option value="10">10 วินาที</option><option value="15">15 วินาที</option><option value="20">20 วินาที</option><option value="30">30 วินาที</option></select>
  <button id="go">เริ่มเกม</button>
</div>

<div id="game">
  <div class="top"><div class="pill">รอบที่ <span id="rnd">0</span></div><div class="pill" id="timer">⏱ 10</div></div>
  <div id="board" class="rank"></div>
  <div class="stage"><div class="deck" id="deck">
    <svg class="ring" viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="48"/><circle id="prog" class="prg" cx="50" cy="50" r="48"/></svg>
    <div class="disc"><div class="vinyl" id="vinyl"><div class="label" id="label"></div></div></div>
    <div class="sleeve" id="sleeve"></div>
    <div class="arm" id="arm"></div>
  </div></div>
  <div id="slots"></div>
  <div id="lyricBg"></div>
  <div id="winner"></div>
  <div class="panel"><h2>💬 คอมเมนต์</h2><div id="feed"></div></div>
  <div id="test"><button id="skip" class="ghost">ข้ามเพลง</button></div>
</div>
<div id="toast"></div>
<div id="tap"><button id="tapb">🔊 แตะเพื่อเปิดเสียงและเริ่ม</button></div>
<div id="yt"><div id="player"></div></div>

<script>
const $=id=>document.getElementById(id);
let lyTick=null,wTimers=[],lineKey=-1;
let player,ids=[],order=[],idx=-1,cur=null,tick=null,nextTimer=null,players={},left=0,active=false,lyrics=[],DUR=10,rnd=0;
const MARK=/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('go').onclick=()=>{
  const m=$('pl').value.match(/list=([\w-]+)/)||[null,$('pl').value.trim()];
  if(!m[1])return alert('ใส่ลิงก์เพลย์ลิสต์ก่อน');
  window.PLID=m[1];DUR=+$('dur').value;
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
  $('setup').style.display='none';$('game').style.display='flex';$('timer').textContent='⏱ '+DUR;drawBoard();
  connectWS();
};
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('player',{height:'200',width:'200',playerVars:{listType:'playlist',list:PLID,playsinline:1},
    events:{onReady:()=>{player.unMute();player.setVolume(100);$('tap').style.display='flex'},onError:()=>{if(cur)next()}}});
};
$('tapb').onclick=()=>{
  $('tap').style.display='none';player.unMute();player.setVolume(100);player.playVideo();
  setTimeout(()=>{ids=player.getPlaylist()||[];if(!ids.length)return alert('โหลดเพลย์ลิสต์ไม่ได้');order=shuffle([...ids.keys()]);next()},1200);
};

const cleanAuthor=a=>(a||'').replace(/ - Topic|VEVO|\bOfficial\b|\bMusic\b|\bChannel\b/ig,'').trim();
function parseTitle(t,artists=[]){
  t=t.replace(/[\(\[【].*?[\)\]】]/g,' ').replace(/\b(official|mv|m\/v|audio|lyrics?|lyric video|music video|visualizer)\b/ig,' ').replace(/เนื้อเพลง/g,' ');
  t=t.replace(/\s*(feat\.?|ft\.?|featuring)\s.*$/i,'');
  const q=t.match(/[「『“"]([^」』”"]{2,})[」』”"]/);if(q)t=q[1];
  const ar=artists.map(a=>(a||'').trim()).filter(a=>a.length>=2);
  const hit=s=>{const n=norm(s);return n.length>=2&&ar.some(a=>{const m=norm(a);return m===n||(n.length>=3&&m.includes(n))})};
  let parts=t.split(/\s[-–—|:]\s|\s\/\s/).map(s=>s.trim()).filter(Boolean);
  if(parts.length>1){const kept=parts.filter(x=>!hit(x));if(kept.length&&kept.length<parts.length)parts=kept}
  let r=(parts.length>1?parts[1]:parts[0]||t).trim();
  ar.forEach(a=>{ // ศิลปินต่อท้ายหรือนำหน้าโดยไม่มีขีดคั่น
    const cut=r.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),' ').replace(/\s+/g,' ').trim();
    if(cut.length>=2)r=cut});
  return r.replace(/^[-–—|:\s]+|[-–—|:\s]+$/g,'');
}
const norm=s=>s.toLowerCase().replace(/[\s\-_.,!?'"()]/g,'');
const chars=s=>{const o=[];for(const c of Array.from(s)){if(MARK.test(c)&&o.length)o[o.length-1]+=c;else o.push(c)}return o};

const clean=t=>t.replace(/[\(\[【].*?[\)\]】]/g,'').replace(/\s*(feat\.?|ft\.?|featuring)\s.*$/i,'').trim();
async function findMatch(title,author,ytDur){
  const nt=norm(title),au=cleanAuthor(author),base=parseTitle(title,[au]);
  let loose=null,artist='';
  const longest=arr=>arr.sort((x,y)=>y.trackName.length-x.trackName.length)[0]||null; // เอาชื่อยาวสุด กันได้ชื่อไม่ครบ
  for(const q of [base+' '+au,base]){
    try{
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),4000);
      const j=await (await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(q),{signal:ctl.signal})).json();clearTimeout(to);
      const ok=x=>{const n=norm(clean(x.trackName||''));return n.length>=2&&nt.includes(n)};
      j.forEach(x=>{const a=norm(x.artistName||'');if(!artist&&a.length>=2&&nt.includes(a))artist=x.artistName});
      const strict=longest(j.filter(x=>x.syncedLyrics&&Math.abs(x.duration-ytDur)<=5&&ok(x)));
      if(strict)return {m:{...strict,strict:true},artist:strict.artistName||artist};
      loose=loose||longest(j.filter(ok));
    }catch(e){}
  }
  return {m:loose,artist:(loose&&loose.artistName)||artist};
}
function parseLRC(t){return t.split('\n').map(l=>{const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);return m?{t:+m[1]*60+ +m[2],s:m[3].trim()}:null}).filter(x=>x&&x.s.length>3)}
function findChorus(L){ // ท่อนฮุก = กลุ่มบรรทัดที่ซ้ำกลุ่มแรกในเพลง
  const cnt={};L.forEach(x=>{const k=norm(x.s);cnt[k]=(cnt[k]||0)+1});
  const rep=L.map(x=>cnt[norm(x.s)]>=2);
  let i=rep.findIndex((v,k)=>v&&rep[k+1]);if(i<0)i=rep.indexOf(true);
  return i<0?null:L[i].t;
}
async function next(){
  clearInterval(lyTick);clearInterval(tick);clearTimeout(nextTimer);active=false;
  idx=(idx+1)%order.length;rnd++;$('rnd').textContent=rnd;
  player.loadVideoById({videoId:ids[order[idx]],startSeconds:0});
  $('winner').textContent='';$('winner').className='';clearLyric();$('label').classList.remove('reveal');$('deck').classList.remove('reveal');
  $('prog').style.transition='none';$('prog').style.strokeDashoffset=0;$('timer').textContent='⏱ '+DUR;
  await new Promise(r=>setTimeout(r,1800));
  const d=player.getVideoData(),ytDur=player.getDuration()||180;
  player.pauseVideo();
  const r=await findMatch(d.title,d.author,ytDur),m=r.m,artists=[cleanAuthor(d.author),r.artist];
  cur={vid:d.video_id,ans:parseTitle(d.title,artists),synced:null,plain:[],hook:null};
  if(m){
    cur.ans=clean(m.trackName)||cur.ans;
    if(m.strict&&m.syncedLyrics){cur.synced=parseLRC(m.syncedLyrics);cur.hook=findChorus(cur.synced)}
    cur.plain=(m.plainLyrics||'').split('\n').map(x=>x.trim()).filter(x=>x.length>6);
  }
  cur.alts=[...new Set([norm(cur.ans),norm(parseTitle(d.title,artists))])].filter(x=>x.length>=2);
  cur.seek=cur.hook!=null?Math.max(0,Math.min(cur.hook-1,ytDur-DUR-3)):Math.floor(ytDur*(0.2+Math.random()*0.4));
  {const u=`url(https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg)`;$('label').style.backgroundImage=u;$('sleeve').style.backgroundImage=u}
  $('slots').innerHTML=chars(cur.ans).map(c=>c.trim()===''?'<div class="slot gap"></div>':'<div class="slot">&nbsp;</div>').join('');
  player.seekTo(cur.seek,true);setTimeout(startRound,500);
}
function reveal(n){
  const cs=chars(cur.ans),els=[...$('slots').children];
  shuffle(cs.map((c,i)=>i).filter(i=>cs[i].trim()&&!els[i].classList.contains('on'))).slice(0,n)
    .forEach(i=>{els[i].textContent=cs[i];els[i].classList.add('on','pop')});
}
function startRound(){
  active=true;let t=DUR;
  player.playVideo();$('vinyl').classList.add('on');$('arm').classList.add('on');
  const p=$('prog');void p.getBoundingClientRect();p.style.transition=`stroke-dashoffset ${DUR}s linear`;p.style.strokeDashoffset=301.6;
  const L=[Math.round(DUR*.8),Math.round(DUR*.5),Math.round(DUR*.2)],m1=Math.round(DUR*.7),m2=Math.round(DUR*.4);
  tick=setInterval(()=>{
    t--;left=t;$('timer').textContent='⏱ '+t;
    if(t===m1)reveal(Math.ceil(chars(cur.ans).length*.15));
    if(t===m2)reveal(Math.ceil(chars(cur.ans).length*.2));
    const li=L.indexOf(t);
    if(li>-1&&!cur.synced&&cur.plain.length>4){const s0=Math.floor(cur.plain.length*.3);showLine(cur.plain.slice(s0+li*2,s0+li*2+2).join(' '),2.4)}
    if(t<=0)end(null);
  },1000);
  const t0=performance.now();lineKey=-1;
  lyTick=setInterval(()=>{ // เนื้อเพลงตามเสียง ขึ้นทีละคำ (เริ่มหลังผ่านไป 20% ของเวลา)
    if(!cur.synced||(performance.now()-t0)/1000<DUR*.2)return;
    const now=player.getCurrentTime()+.2;let k=-1;
    for(let i=0;i<cur.synced.length;i++){if(cur.synced[i].t<=now)k=i;else break}
    if(k>-1&&k!==lineKey){lineKey=k;const nx=cur.synced[k+1];showLine(cur.synced[k].s,Math.min(nx?nx.t-cur.synced[k].t:4,5)*.85)}
  },150);
}
function clearLyric(){wTimers.forEach(clearTimeout);wTimers=[];lineKey=-1;$('lyricBg').innerHTML=''}
function segWords(t){try{return [...new Intl.Segmenter('th',{granularity:'word'}).segment(t)].map(x=>x.segment).filter(x=>x.trim())}catch(e){return t.split(/\s+/)}}
function showLine(text,span){
  wTimers.forEach(clearTimeout);wTimers=[];
  const ws=segWords(text);if(!ws.length)return;
  const box=$('lyricBg');box.innerHTML=ws.map(w=>`<span class="w">${esc(w)}</span>`).join('');
  const els=[...box.children],step=Math.max(.12,span/ws.length);
  els.forEach((e,i)=>wTimers.push(setTimeout(()=>{els.forEach(x=>x.classList.remove('cur'));e.classList.add('on','cur')},i*step*1000)));
}
function end(who){
  if(!active)return;active=false;clearInterval(tick);clearInterval(lyTick);clearLyric();
  player.pauseVideo();$('vinyl').classList.remove('on');$('arm').classList.remove('on');
  const els=[...$('slots').children],cs=chars(cur.ans);
  els.forEach((e,i)=>{if(cs[i].trim()){e.textContent=cs[i];e.classList.add('on')}});
  $('label').classList.add('reveal');$('deck').classList.add('reveal');
  $('winner').className=who?'win':'lose';
  $('winner').innerHTML=who?`<div class="wcard">${av(who,64)}<div><div class="wn">${esc(who.name)}</div><div class="wp">🎉 ตอบถูก! +${who.gain} คะแนน</div></div></div>`:'⏰ หมดเวลา!';
  nextTimer=setTimeout(next,6000);
}
$('skip').onclick=()=>{if(!cur)return;if(active)end(null);else{clearTimeout(nextTimer);next()}};

const av=(p,s)=>`<span class="av" style="--s:${s}px"><b>${esc((p.name||'?').trim().charAt(0).toUpperCase())}</b>${p.avatar?`<img src="${esc(p.avatar)}" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</span>`;
function addPoints(key,name,avatar,n){const p=players[key]||(players[key]={name,avatar:'',pts:0,shared:false});if(avatar)p.avatar=avatar;p.pts+=n;return p}
function toast(t,ms=2800){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),ms)}
function onComment(user,text,avatar,id){
  const key=id||user;if(avatar&&players[key])players[key].avatar=avatar;
  const f=$('feed');f.insertAdjacentHTML('afterbegin',`<div><b>${esc(user)}</b>: ${esc(text)}</div>`);
  if(f.children.length>50)f.lastChild.remove();
  if(!active||!cur)return;
  const c=norm(text);
  if(c.length>=2&&cur.alts.some(a=>c===a||c.includes(a)||(c.length>=3&&a.includes(c)&&c.length>=a.length*.6))){
    const gain=10+Math.max(0,left),p=addPoints(key,user,avatar,gain);
    drawBoard();speak(user+' ตอบถูก');end({name:user,avatar:p.avatar,gain});
  }
}
function onShare(d){ // แชร์ไลฟ์ได้โบนัส 20 คะแนน (ครั้งเดียวต่อคน)
  const key=d.id||d.user;if(players[key]&&players[key].shared)return;
  const p=addPoints(key,d.user,d.avatar,20);p.shared=true;
  drawBoard();toast(`🔗 ${d.user} แชร์ไลฟ์ +20 คะแนน`);speak(d.user+' แชร์ไลฟ์');
}
function drawBoard(){
  const list=Object.values(players).sort((a,b)=>b.pts-a.pts).slice(0,5);
  $('board').innerHTML=[0,1,2,3,4].map(i=>{const p=list[i];
    return p?`<div class="rk r${i}"><i>${i+1}</i>${av(p,36)}<span class="nm">${esc(p.name)}${p.shared?' 🔗':''}</span><b>${p.pts}</b></div>`
            :`<div class="rk empty"><i>${i+1}</i><div class="ph"></div><span class="nm">—</span><b>0</b></div>`}).join('');
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function connectWS(){
  const u=$('ws').value.trim();if(!u)return;
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  w.onopen=()=>w.send(JSON.stringify({type:'join',username:u}));
  w.onmessage=e=>{try{const d=JSON.parse(e.data);
    if(d.type==='status'){$('feed').insertAdjacentHTML('afterbegin','<div>'+esc(d.text)+'</div>');toast(d.text,6000);return}
    if(d.type==='ping')return;if(d.type==='share')return onShare(d);onComment(d.user||'?',d.comment||'',d.avatar,d.id)}catch(_){}};
  w.onerror=()=>toast('ต่อเซิร์ฟเวอร์ไม่ได้ (WebSocket)',5000);w.onclose=()=>setTimeout(connectWS,3000);
}
</script>
</body>
</html>
