<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทายเพลง Live</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14091f;--panel:#22123a;--ink:#fff3e0;--mute:#b9a6d6;--hot:#ff3d81;--gold:#ffc83d;--ok:#3dffb0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 30% 0,#3a1670,var(--bg) 60%);color:var(--ink);font-family:Sarabun,sans-serif;min-height:100vh}
h1,h2,.slot{font-family:Mitr,sans-serif}
#setup{max-width:560px;margin:0 auto;padding:24px}
#setup input,#setup button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:0;font:inherit}
#setup input{background:#fff;color:#222}
button{background:var(--hot);color:#fff;font-weight:700;cursor:pointer}
button.alt{background:#4b2d7a}
small{color:var(--mute)}
#game{display:none;grid-template-columns:1fr 320px;gap:20px;padding:20px;max-width:1200px;margin:0 auto;min-height:100vh}
#stage{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#yt{position:fixed;right:0;bottom:0;width:200px;height:113px;opacity:.02;pointer-events:none;z-index:-1}
#tap{position:fixed;inset:0;background:#14091fee;display:none;align-items:center;justify-content:center;z-index:9}#tap button{font:600 24px Mitr;padding:20px 32px;border:0;border-radius:16px}
.vinylWrap{position:relative;width:min(380px,80vw);aspect-ratio:1}
.vinyl{width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle,#0a0a0a 0 3px,#1b1b1b 4px 5px);box-shadow:0 20px 50px #000a,inset 0 0 0 6px #000;position:relative;animation:spin 3s linear infinite;animation-play-state:paused}
.vinyl.on{animation-play-state:running}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 20%,#fff2 25%,transparent 30% 70%,#fff2 75%,transparent 80%)}
.label{position:absolute;inset:32%;border-radius:50%;background:#444 center/cover;border:4px solid #000;filter:blur(14px) grayscale(.6);transition:filter .8s}
.label.reveal{filter:none}
.label::after{content:"";position:absolute;inset:44%;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;right:-6%;top:-4%;width:8px;height:48%;background:linear-gradient(#ddd,#888);border-radius:6px;transform-origin:top;transform:rotate(18deg);box-shadow:0 4px 8px #0008}
#timer{font:600 56px Mitr;color:var(--gold)}
#slots{display:flex;flex-wrap:wrap;gap:8px 6px;justify-content:center;max-width:720px}
.slot{min-width:34px;height:48px;border-bottom:4px solid var(--gold);font-size:30px;line-height:48px;padding:0 4px}
.slot.gap{border:0;min-width:16px}
.slot.on{color:var(--ok);border-color:var(--ok)}
#lyric{min-height:64px;font-size:26px;font-weight:700;color:#ffe08a;max-width:720px}
#lyric span{display:block;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4) translateY(20px);opacity:0}}
#winner{font:600 30px Mitr;color:var(--ok);min-height:42px}
#side{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 40px)}
#board li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #fff2}
ol{margin:0;padding-left:22px}
#feed{flex:1;overflow:auto;font-size:14px;color:var(--mute)}
#feed b{color:var(--ink)}
#test{display:flex;gap:6px}#test input{flex:1;padding:8px;border-radius:8px;border:0}
@media(max-width:800px){#game{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.vinyl{animation:none}}
#game{grid-template-columns:1fr;padding:10px;gap:10px;min-height:100dvh}
.vinylWrap{width:min(300px,68vw)}
#timer{font-size:44px}.slot{min-width:26px;height:38px;font-size:22px;line-height:38px}
#lyric{font-size:20px;min-height:56px}#winner{font-size:22px}
#side{max-height:none}#feed{max-height:22vh}
#setup input,#setup button{font-size:16px}
</style>
</head>
<body>
<div id="setup">
  <h1>🎵 ทายเพลง Live</h1>
  <small>วางลิงก์เพลย์ลิสต์ YouTube (ต้องตั้งเป็นสาธารณะหรือไม่แสดงในรายการ)</small>
  <input id="pl" placeholder="https://www.youtube.com/playlist?list=PL...">
  <small>ชื่อ TikTok ที่กำลังไลฟ์ (ไม่ใส่ก็ได้ ใช้ช่องทดสอบแทน)</small>
  <input id="ws" placeholder="@username" autocapitalize="off">
  <div id="st"></div>
  <button id="go">เริ่มเกม</button>
</div>

<div id="game">
  <div id="stage">
    <div id="timer">10</div>
    <div class="vinylWrap"><div class="vinyl" id="vinyl"><div class="label" id="label"></div></div><div class="arm"></div></div>
    <div id="slots"></div>
    <div id="lyric"></div>
    <div id="winner"></div>
    <div><button class="alt" id="skip" style="padding:8px 16px;border:0;border-radius:8px">ข้ามเพลง</button></div>
  </div>
  <aside id="side">
    <h2 style="margin:0">🏆 อันดับ</h2>
    <ol id="board"></ol>
    <h2 style="margin:0">💬 คอมเมนต์</h2>
    <div id="feed"></div>
    <div id="test"><input id="tu" placeholder="ชื่อ" style="max-width:90px"><input id="tc" placeholder="ทดสอบตอบ..."><button id="tb" style="padding:8px">ส่ง</button></div>
  </aside>
</div>
<div id="tap"><button id="tapb">🔊 แตะเพื่อเปิดเสียงและเริ่ม</button></div>
<div id="yt"><div id="player"></div></div>

<script>
const $=id=>document.getElementById(id);
let player,ids=[],order=[],idx=-1,cur=null,tick=null,scores={},active=false,lyrics=[];
const MARK=/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/;

// ---- YouTube IFrame API ----
$('go').onclick=()=>{
  const m=$('pl').value.match(/list=([\w-]+)/)||[null,$('pl').value.trim()];
  if(!m[1])return alert('ใส่ลิงก์เพลย์ลิสต์ก่อน');
  window.PLID=m[1];
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
  $('setup').style.display='none';$('game').style.display='grid';
  connectWS();
};
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('player',{height:'200',width:'200',playerVars:{listType:'playlist',list:PLID,playsinline:1},
    events:{onReady:()=>{player.unMute();player.setVolume(100);$('tap').style.display='flex'},
    onError:()=>{if(cur)next()}}});
};
$('tapb').onclick=()=>{ // แตะครั้งนี้ปลดล็อกเสียงบนมือถือ
  $('tap').style.display='none';
  player.unMute();player.setVolume(100);player.playVideo();
  setTimeout(()=>{ids=player.getPlaylist()||[];order=shuffle([...ids.keys()]);next()},1200);
};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

// ---- title -> answer ----
function parseTitle(t){
  t=t.replace(/[\(\[【].*?[\)\]】]/g,'').replace(/official|mv|m\/v|audio|lyrics?|เนื้อเพลง/ig,'');
  const p=t.split(/\s[-–|]\s/); // "ศิลปิน - ชื่อเพลง"
  return (p.length>1?p[1]:p[0]).trim();
}
const norm=s=>s.toLowerCase().replace(/[\s\-_.,!?'"()]/g,'');
const chars=s=>{const out=[];for(const c of Array.from(s)){if(MARK.test(c)&&out.length)out[out.length-1]+=c;else out.push(c)}return out};

// ---- round ----
async function next(){
  clearInterval(tick);active=false;
  idx=(idx+1)%order.length;
  const vid=ids[order[idx]];
  player.loadVideoById({videoId:vid,startSeconds:0});
  $('winner').textContent='';$('lyric').innerHTML='';$('label').classList.remove('reveal');
  await new Promise(r=>setTimeout(r,1800));
  const d=player.getVideoData(),dur=player.getDuration()||180;
  const start=Math.floor(dur*(0.2+Math.random()*0.4));
  player.pauseVideo();player.seekTo(start,true);
  cur={vid,full:d.title,ans:parseTitle(d.title),author:d.author};
  $('label').style.backgroundImage=`url(https://i.ytimg.com/vi/${vid}/hqdefault.jpg)`;
  renderSlots();fetchLyrics();
  setTimeout(startRound,600);
}
function renderSlots(){
  $('slots').innerHTML=chars(cur.ans).map(c=>c.trim()===''?'<div class="slot gap"></div>':'<div class="slot">&nbsp;</div>').join('');
}
function reveal(n){ // เปิดตัวอักษรเป็นใบ้
  const cs=chars(cur.ans),els=[...$('slots').children];
  const pool=cs.map((c,i)=>i).filter(i=>cs[i].trim()&&!els[i].classList.contains('on'));
  shuffle(pool).slice(0,n).forEach(i=>{els[i].textContent=cs[i];els[i].classList.add('on')});
}
async function fetchLyrics(){
  lyrics=[];
  try{
    const q=encodeURIComponent(cur.ans+' '+cur.author.replace(/ - Topic/,''));
    const r=await fetch('https://lrclib.net/api/search?q='+q);const j=await r.json();
    const txt=(j[0]&&j[0].plainLyrics)||'';
    lyrics=txt.split('\n').map(s=>s.trim()).filter(s=>s.length>6);
  }catch(e){}
}
function startRound(){
  active=true;let t=10;$('timer').textContent=t;
  player.playVideo();$('vinyl').classList.add('on');
  const lines=lyrics.length>4?(i=>{const s=Math.floor(lyrics.length*0.3);return lyrics.slice(s+i*2,s+i*2+2)}):()=>[];
  tick=setInterval(()=>{
    t--;$('timer').textContent=t;
    if(t===7)reveal(Math.ceil(chars(cur.ans).length*.15)); // ใบ้ตัวอักษร
    if(t===4)reveal(Math.ceil(chars(cur.ans).length*.2));
    if(t===8||t===5||t===2){const l=lines(t===8?0:t===5?1:2);if(l.length)$('lyric').innerHTML=`<span>♪ ${l.join('<br>')}</span>`}
    if(t<=0)end(null);
  },1000);
}
function end(who){
  if(!active)return;active=false;clearInterval(tick);
  player.pauseVideo();$('vinyl').classList.remove('on');
  const els=[...$('slots').children],cs=chars(cur.ans);
  els.forEach((e,i)=>{if(cs[i].trim()){e.textContent=cs[i];e.classList.add('on')}});
  $('label').classList.add('reveal');
  $('winner').textContent=who?`🎉 ${who} ตอบถูก! — ${cur.ans}`:`หมดเวลา — ${cur.ans}`;
  setTimeout(next,6000);
}
$('skip').onclick=()=>{if(active)end(null);else{clearTimeout();next()}};

// ---- comments ----
function onComment(user,text){
  const f=$('feed');f.insertAdjacentHTML('afterbegin',`<div><b>${esc(user)}</b>: ${esc(text)}</div>`);
  if(f.children.length>60)f.lastChild.remove();
  if(!active||!cur)return;
  const a=norm(cur.ans),c=norm(text);
  if(c.length>=2&&(c===a||c.includes(a)||(c.length>=3&&a.includes(c)&&c.length>=a.length*.6))){
    scores[user]=(scores[user]||0)+1;drawBoard();
    speak(user+' ตอบถูก');end(user);
  }
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function drawBoard(){
  $('board').innerHTML=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([u,s])=>`<li><span>${esc(u)}</span><b>${s}</b></li>`).join('');
}
function speak(t){ // อ่านชื่อคนตอบ
  try{const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function connectWS(){
  const u=$('ws').value.trim();if(!u)return;
  const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  w.onopen=()=>w.send(JSON.stringify({type:'join',username:u}));
  w.onmessage=e=>{try{const d=JSON.parse(e.data);
    if(d.type==='status'){$('feed').insertAdjacentHTML('afterbegin','<div>'+esc(d.text)+'</div>');return}
    if(d.type==='ping')return;
    onComment(d.user||'?',d.comment||'')}catch(_){}};
  w.onclose=()=>setTimeout(connectWS,3000);
}
$('tb').onclick=()=>{const c=$('tc').value;if(c){onComment($('tu').value||'ทดสอบ',c);$('tc').value=''}};
$('tc').onkeydown=e=>{if(e.key==='Enter')$('tb').click()};
</script>
</body>
</html>
